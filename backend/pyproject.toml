[project]
name = "docintel"
version = "0.1.0"
description = "Enterprise Document Intelligence Platform - backend (API, workers, AI, MCP)"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "alembic>=1.20,<2",
    "boto3>=1.43,<2",
    "fastapi>=0.142.4,<0.143",
    "google-genai>=2.29,<3",
    "httpx>=0.28.1,<0.29",
    "langgraph>=1.2.12,<1.3",
    "mcp>=2.2.0,<2.3",
    "numpy>=2.5,<3",
    "pgvector>=0.5.0,<0.5.1",
    "pillow>=12.3,<13",
    "prometheus-client>=0.26,<0.27",
    "psycopg[binary]>=3.3.6,<4",
    "pwdlib[argon2]>=0.3.1,<0.4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pyjwt>=2.15.1,<3",
    "pypdfium2>=5.14,<6",
    "python-multipart>=0.0.32,<0.1",
    "rapidfuzz>=3.14,<4",
    "scikit-learn>=1.9,<2",
    "scipy>=1.18,<2",
    "sqlalchemy[asyncio]>=2.1.4,<2.2",
    "structlog>=26.1,<27",
    "uvicorn[standard]>=0.54,<0.55",
]

[project.scripts]
docintel = "docintel.cli:main"

[project.optional-dependencies]
local-embeddings = [
    "fastembed>=0.8.1,<0.9",
]

[dependency-groups]
dev = [
    "import-linter>=2.15,<3",
    "moto[s3,server]>=5.2.3,<6",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "respx>=0.23.1,<0.24",
    "ruff>=0.16.10,<0.17",
    "scipy-stubs>=1.16",
    "types-boto3[s3]>=1.43,<2",
    "types-reportlab>=4,<6",
]
synthetic = [
    "reportlab>=5.0.1,<6",
]

[tool.uv]
# `uv sync` installs dev tooling and the synthetic-data generator; images use --no-default-groups.
default-groups = ["dev", "synthetic"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PTH", "N", "T20", "PT", "RET",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "ASYNC240"]  # asserts, test secrets, random, tmp-file I/O
"src/docintel/db/migrations/versions/**" = ["N999"]
"src/docintel/cli.py" = ["T201"]  # the CLI prints to stdout by design
"src/docintel/classification/corpus.py" = ["E501"]  # phrase data reads better unwrapped

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["docintel"]
warn_unreachable = true

[[tool.mypy.overrides]]
# respx, pypdfium2 and scikit-learn ship without type information (no maintained stubs).
module = ["respx.*", "pypdfium2.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: needs a PostgreSQL server (TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:docintel.*"]

# Architecture contracts, checked by `lint-imports` in `make lint` and CI (ADR-076).
[tool.importlinter]
root_package = "docintel"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entry points > HTTP API > domain > infrastructure > database > core"
type = "layers"
# "|" = independent siblings, ":" = siblings that may use each other. The domain packages
# share one layer: they call each other (documents -> processing -> workers -> documents).
layers = [
    "docintel.cli",
    "docintel.evaluation | docintel.tools",
    "docintel.api",
    """docintel.agent : docintel.auth : docintel.classification : docintel.comparisons
    : docintel.dashboard : docintel.documents : docintel.fields : docintel.knowledge
    : docintel.matching : docintel.observability : docintel.processing : docintel.reports
    : docintel.review : docintel.rules : docintel.search : docintel.synthetic
    : docintel.vendors : docintel.versions : docintel.workers : docintel.workflows""",
    "docintel.ai | docintel.audit | docintel.storage",
    "docintel.db",
    "docintel.core",
]
ignore_imports = [
    # The table of headline metrics (stdlib only), shared with the README generator.
    "docintel.api.routers.evaluations -> docintel.evaluation.headlines",
]

[[tool.importlinter.contracts]]
name = "The web framework stays in the HTTP API (and the MCP HTTP server's Starlette)"
type = "forbidden"
source_modules = [
    "docintel.agent", "docintel.ai", "docintel.audit", "docintel.auth",
    "docintel.classification", "docintel.comparisons", "docintel.core", "docintel.dashboard",
    "docintel.db", "docintel.documents", "docintel.fields", "docintel.knowledge",
    "docintel.matching", "docintel.observability", "docintel.processing", "docintel.reports",
    "docintel.review", "docintel.rules", "docintel.search", "docintel.storage",
    "docintel.synthetic", "docintel.vendors", "docintel.versions", "docintel.workers",
    "docintel.workflows",
]
forbidden_modules = ["fastapi"]
allow_indirect_imports = true  # direct imports only: a service may be called from the API
ignore_imports = [
    # The upload services take the framework's UploadFile (a spooled file and its headers).
    "docintel.documents.service -> fastapi",
    "docintel.knowledge.service -> fastapi",
]

[[tool.importlinter.contracts]]
name = "Model providers are reached only through docintel.ai"
type = "forbidden"
source_modules = [
    "docintel.agent", "docintel.api", "docintel.classification", "docintel.documents",
    "docintel.fields", "docintel.knowledge", "docintel.processing", "docintel.search",
    "docintel.workers", "docintel.workflows",
]
forbidden_modules = ["google"]  # the Gemini SDK (google.genai)
allow_indirect_imports = true  # through docintel.ai, which is the point
