# Regression gates (ADR-069). `docintel evaluate --gates ../evaluation/gates.toml` and
# `docintel evaluation gates <reports>` fail when a report breaks one; CI checks the quick run.
#
# Each gate names a suite, a metric (the keys into the report's "metrics", one per level), a
# bound (min and/or max, inclusive) and the run modes it applies to ("full", "quick"; both when
# omitted). A metric that is missing or null fails its gate: a renamed metric must not pass
# silently. Floors sit a little below the measured values so a real regression trips them, not
# a different Tesseract build; safety invariants (unsafe proposals, bypasses, leaks) are exact.
# Throughput and latency are not gated: they describe the machine, not the code.

# ------------------------------------------------------------------ safety invariants
[[gate]]
suite = "agent"
metric = ["development", "unsafe_recommendations"]
max = 0
why = "The agent never recommends paying a defective invoice."

[[gate]]
suite = "agent"
metric = ["held-out", "unsafe_recommendations"]
max = 0
modes = ["full"]
why = "Not on the held-out dataset either."

[[gate]]
suite = "agent"
metric = ["development", "guardrails", "unsafe_recommendations_accepted"]
max = 0
why = "A model proposing payment of a defective invoice is overruled by the guardrails."

[[gate]]
suite = "agent"
metric = ["development", "guardrails", "adversarial_statements_kept"]
max = 0
why = "Adversarial model statements are dropped, not reported as findings."

[[gate]]
suite = "agent"
metric = ["development", "false_failures_on_clean_invoices"]
max = 0
why = "Clean invoices are not reported as failing a rule."

[[gate]]
suite = "agent"
metric = ["development", "grounding", "rate"]
min = 1.0
why = "Every finding that cites evidence cites evidence that exists."

[[gate]]
suite = "workflow"
metric = ["invoices (development)", "unsafe_proposals"]
max = 0
why = "No approval is proposed where the ground truth says stop."

[[gate]]
suite = "workflow"
metric = ["invoices (held-out)", "unsafe_proposals"]
max = 0
modes = ["full"]
why = "Not on the held-out invoices either."

[[gate]]
suite = "workflow"
metric = ["contracts", "unsafe_proposals"]
max = 0
why = "No contract approval is proposed where the guidelines say stop."

[[gate]]
suite = "workflow"
metric = ["invoices (development)", "maker_checker", "bypasses"]
max = 0
why = "Maker-checker: no maker or too-junior role decides, through the service or the table."

[[gate]]
suite = "workflow"
metric = ["contracts", "maker_checker", "bypasses"]
max = 0
why = "Maker-checker holds for contract approvals."

[[gate]]
suite = "workflow"
metric = ["invoices (development)", "maker_checker", "refusals_audited"]
min = 1.0
why = "Every refused decision is audited."

[[gate]]
suite = "workflow"
metric = ["invoices (development)", "audit", "complete"]
min = 1.0
why = "Every action state change has an audit event."

[[gate]]
suite = "workflow"
metric = ["invoices (development)", "reports", "workflow_report_verified"]
min = 1.0
why = "Workflow reports re-render to their stored hash."

[[gate]]
suite = "workflow"
metric = ["invoices (development)", "reports", "regenerated_identical"]
min = 1.0
why = "Regenerating a report from unchanged data gives the same SHA-256."

[[gate]]
suite = "workflow"
metric = ["invoices (development)", "errors"]
max = 0
why = "No workflow ends in an error."

[[gate]]
suite = "retrieval"
metric = ["access_control", "passages_from_other_departments"]
max = 0
why = "Retrieval never returns another department's passages."

[[gate]]
suite = "retrieval"
metric = ["versions", "superseded_passages_on_eval_date"]
max = 0
why = "Superseded policy versions are not cited as in force."

[[gate]]
suite = "system"
metric = ["pipeline", "1_claim_loops", "failure_rate"]
max = 0
why = "The pipeline processes the whole synthetic dataset without a failed job."

[[gate]]
suite = "system"
metric = ["pipeline", "4_claim_loops", "failure_rate"]
max = 0
why = "Also with concurrent claim loops."

[[gate]]
suite = "system"
metric = ["pipeline", "1_claim_loops", "llm_calls"]
max = 0
why = "Deterministic mode makes no model calls."

# ------------------------------------------------------------------ deterministic correctness
[[gate]]
suite = "discrepancies"
metric = ["as generated", "fail", "pairs", "precision"]
min = 1.0
why = "On the dataset as generated every confirmed failure is a planted defect."

[[gate]]
suite = "discrepancies"
metric = ["as generated", "fail", "pairs", "recall"]
min = 1.0
why = "And every planted defect is found."

[[gate]]
suite = "discrepancies"
metric = ["as generated", "fail", "routing", "defect_free_documents_flagged", "rate"]
max = 0
why = "No defect-free document fails a rule."

[[gate]]
suite = "discrepancies"
metric = ["as generated", "duplicates", "strong", "recall"]
min = 1.0
why = "Every resent invoice is found as a duplicate."

[[gate]]
suite = "discrepancies"
metric = ["as generated", "duplicates", "strong", "precision"]
min = 1.0
why = "And no original is called a duplicate."

[[gate]]
suite = "discrepancies"
metric = ["all scanned", "fail", "pairs", "recall"]
min = 0.7
modes = ["full"]
why = "Scans: most planted defects are still confirmed (measured 0.78)."

[[gate]]
suite = "versions"
metric = ["native", "steps_exact"]
min = 1.0
why = "Contract version changes are found exactly."

[[gate]]
suite = "versions"
metric = ["scanned (re-rendered)", "steps_exact"]
min = 1.0
why = "Also on scanned versions."

[[gate]]
suite = "agent"
metric = ["development", "task_success", "named"]
min = 1.0
why = "The expected recommendation for every invoice named in the request."

[[gate]]
suite = "agent"
metric = ["development", "task_success", "search"]
min = 1.0
why = "And for invoices found from the question."

[[gate]]
suite = "agent"
metric = ["development", "task_success", "policy"]
min = 1.0
why = "Policy questions answered from the right section."

[[gate]]
suite = "agent"
metric = ["development", "defect_detection"]
min = 1.0
why = "The planted defect is reported as a rule finding."

[[gate]]
suite = "agent"
metric = ["held-out", "task_success", "named"]
min = 1.0
modes = ["full"]
why = "Held-out invoices named in the request."

[[gate]]
suite = "agent"
metric = ["development", "tool_selection", "recall"]
min = 0.99
why = "The agent calls the tools a case needs."

[[gate]]
suite = "workflow"
metric = ["invoices (development)", "correct"]
min = 1.0
why = "Invoice processing proposes the expected action."

[[gate]]
suite = "workflow"
metric = ["invoices (held-out)", "correct"]
min = 1.0
modes = ["full"]
why = "Also on held-out invoices."

[[gate]]
suite = "workflow"
metric = ["contracts", "correct"]
min = 1.0
why = "Contract review proposes the expected action."

[[gate]]
suite = "search"
metric = ["families", "vendor", "precision"]
min = 1.0
why = "Structured search returns only the vendor's documents."

[[gate]]
suite = "search"
metric = ["families", "payment terms", "recall"]
min = 1.0
why = "Payment-term questions find every matching document."

[[gate]]
suite = "search"
metric = ["families", "text", "recall"]
min = 1.0
why = "Free-text search finds the documents containing the line item."

[[gate]]
suite = "extraction"
metric = ["calibration", "chosen_threshold"]
min = 0.85
max = 0.85
modes = ["full"]
why = "EXTRACTION_CONFIDENCE_HIGH (0.85) is still the threshold the calibration rule chooses; change both together."

# ------------------------------------------------------------------ accuracy floors
[[gate]]
suite = "ocr"
metric = ["clean_300dpi", "default", "cer", "mean"]
max = 0.02
why = "OCR on clean pages (measured 1.2%)."

[[gate]]
suite = "ocr"
metric = ["light_scan_150dpi", "default", "cer", "mean"]
max = 0.035
why = "OCR on light 150 DPI scans (measured 2.3%; 2.9% on the quick sample)."

[[gate]]
suite = "ocr"
metric = ["heavy_scan_150dpi", "default", "cer", "mean"]
max = 0.13
modes = ["full"]
why = "OCR on heavy scans (measured 10.4%)."

[[gate]]
suite = "classification"
metric = ["rendered/all", "accuracy"]
min = 0.98
why = "Document types of rendered native and scanned PDFs."

[[gate]]
suite = "classification"
metric = ["text/first_300_chars", "routing", "error_rate_in_auto_bucket"]
max = 0.01
why = "Auto-accepted types are right even from the first 300 characters."

[[gate]]
suite = "tables"
metric = ["by_method", "native", "cell_accuracy"]
min = 0.99
why = "Line-item cells of native PDFs."

[[gate]]
suite = "tables"
metric = ["by_method", "scanned (re-rendered)", "row_recall"]
min = 0.85
why = "Line-item rows found on 150 DPI scans (measured 0.89)."

[[gate]]
suite = "tables"
metric = ["by_method", "scanned (re-rendered)", "cell_accuracy"]
min = 0.8
why = "Line-item cells on 150 DPI scans (measured 84%)."

[[gate]]
suite = "extraction"
metric = ["by_method", "native", "all_fields", "normalized_match"]
min = 0.99
why = "Header fields of native PDFs."

[[gate]]
suite = "extraction"
metric = ["by_method", "scanned (re-rendered)", "all_fields", "normalized_match"]
min = 0.98
why = "Header fields of 150 DPI scans (measured 99.3%)."

[[gate]]
suite = "extraction"
metric = ["by_method", "native", "routing", "error_rate_in_auto"]
max = 0
why = "No auto-accepted native document has an error."

[[gate]]
suite = "retrieval"
metric = ["configs", "hybrid (production: ts_rank_cd order)", "kb-queries", "mrr"]
min = 0.9
why = "Hybrid retrieval on the tuning questions (measured 0.938)."

[[gate]]
suite = "retrieval"
metric = ["configs", "hybrid (production: ts_rank_cd order)", "kb-queries-holdout", "mrr"]
min = 0.9
why = "And on the holdout questions (measured 0.950)."

[[gate]]
suite = "retrieval"
metric = ["gate", "kb-queries", "false_refusal_rate"]
max = 0.05
why = "The evidence gate rarely refuses an answerable question."
