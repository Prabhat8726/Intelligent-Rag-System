# Local / single-host stack:
#   db -> migrate (one-shot) -> api + worker -> web (nginx on http://localhost:8080)
# Configuration comes from .env (create it with `make env`).

name: docintel

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docintel}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-docintel}
  STORAGE_LOCAL_ROOT: /data/storage

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-docintel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only, for host-based development (`make dev`) and tests.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    image: docintel-backend:local
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: docintel-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      # Only nginx (inside this private network) reaches the API, so its X-Forwarded-For is trusted.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - docstore:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: docintel-backend:local
    command: ["docintel", "worker"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      WORKER_HEARTBEAT_FILE: /tmp/docintel-worker.heartbeat
    volumes:
      - docstore:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "docintel", "worker-health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    # SIGTERM stops claiming new jobs; in-flight jobs get time to finish.
    stop_grace_period: 60s
    restart: unless-stopped

  web:
    build: ./frontend
    image: docintel-web:local
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  docstore:
