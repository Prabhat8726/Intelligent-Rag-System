# Prometheus and Grafana for the stack (ADR-079). Add this file to either stack:
#   local:      docker compose -f docker-compose.yml -f deploy/compose.observability.yml up -d
#   production: docker compose -f docker-compose.yml -f deploy/compose.prod.yml \
#                 -f deploy/compose.observability.yml up -d
# Prometheus finds every API and worker replica by DNS and presents METRICS_TOKEN; both UIs are
# bound to 127.0.0.1 (reach them through an SSH tunnel on a server).

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - metrics_token
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    # Not read-only: compose writes the token secret into the container at start.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - prometheus
    restart: unless-stopped

secrets:
  # Empty locally (no token configured: the endpoints accept any scrape).
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  prometheus-data:
  grafana-data:
