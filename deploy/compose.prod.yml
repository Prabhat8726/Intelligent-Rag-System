# Staging / production on one Docker host (ADR-078), layered over the base file:
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d --wait
# deploy/deploy.sh runs exactly that for a release tag. Configuration comes from .env on the
# host (start from deploy/production.env.example); nothing secret is in this file.
#
# Differences from the local stack:
# * images are pulled from the registry (IMAGE_REGISTRY/IMAGE_TAG), never built on the host;
# * Caddy terminates TLS (automatic certificates) and is the only published service;
# * the database and nginx ports are not published;
# * nightly database backups and retention maintenance run as their own services.


x-backend-image: &backend-image
  image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY in .env}/docintel-backend:${IMAGE_TAG:?set IMAGE_TAG}

services:
  db:
    ports: !reset []
    restart: always

  migrate:
    <<: *backend-image
    build: !reset null

  api:
    <<: *backend-image
    restart: always

  worker:
    <<: *backend-image
    restart: always

  web:
    image: ${IMAGE_REGISTRY}/docintel-web:${IMAGE_TAG}
    build: !reset null
    ports: !reset []
    environment:
      # Caddy, at a fixed address on this network, names the client in X-Forwarded-For;
      # it serves https only (plain http is redirected).
      NGINX_REAL_IP_FROM: 172.30.0.250
      NGINX_FORWARDED_PROTO: https
    restart: always

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # An e-mail address for the ACME account (Let's Encrypt), or "internal" for a local CA.
      CADDY_TLS: ${CADDY_TLS:?set CADDY_TLS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.30.0.250
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      web:
        condition: service_healthy
    restart: always

  # pg_dump every BACKUP_INTERVAL_HOURS into the backups volume, keeping BACKUP_KEEP_DAYS.
  backup:
    image: pgvector/pgvector:0.8.7-pg17
    entrypoint: ["/bin/sh", "/deploy/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-docintel}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-docintel}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/deploy/backup.sh:ro
      - backups:/backups
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # Daily retention (ADR-075): purge documents deleted RETENTION_DELETED_DAYS ago, then delete
  # stored files no row refers to.
  maintenance:
    <<: *backend-image
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - /bin/sh
      - -c
      - >-
        while true; do
        docintel purge-deleted;
        docintel storage-reconcile --delete-orphans;
        sleep 86400;
        done
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docintel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docintel}
      STORAGE_LOCAL_ROOT: /data/storage
    volumes:
      - docstore:/data/storage
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      disable: true  # the image's check probes the API port; this loop serves none
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy-data:
  caddy-config:
  backups:
