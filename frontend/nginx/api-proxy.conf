# Proxy settings shared by the API locations (included by default.conf).
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwrite, never append: the API trusts this header (FORWARDED_ALLOW_IPS), so a value the
# client sent must not reach it. $remote_addr is the client (see set_real_ip_from).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Request-ID $request_id;
proxy_read_timeout 120s;
