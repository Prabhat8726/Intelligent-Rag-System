name: Release images

# Builds the backend and web images, scans them, and pushes them to GitHub Container Registry
# as ghcr.io/<owner>/docintel-{backend,web}:sha-<commit> (plus the version for v* tags and
# "main" for the default branch). The deploy workflow takes one of these tags (ADR-078).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, scan and push ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: docintel-backend
            context: backend
          - image: docintel-web
            context: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry paths are lower case)
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build for the scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.name.outputs.ref }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Vulnerability report (Trivy; critical issues with a fix block the release)
        run: |
          mkdir -p scan
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/scan:/out" \
              aquasec/trivy:0.58.1 image --no-progress --ignore-unfixed "$@" \
              "${{ steps.name.outputs.ref }}:scan"
          }
          scan --severity HIGH,CRITICAL --format table --output /out/vulnerabilities.txt
          cat scan/vulnerabilities.txt
          scan --format cyclonedx --output /out/sbom.cdx.json
          scan --severity CRITICAL --exit-code 1 --quiet

      - name: Scan report and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-scan
          path: scan/
          retention-days: 90

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.ref }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (same build, from the cache)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: true
